name: 每日更新复盘工作台

on:
  schedule:
    # UTC 09:10 = 北京时间 17:10，周一到周五
    - cron: '10 9 * * 1-5'
  # 也可以在网页上手动点一下跑
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fupan-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取同花顺涨停池
        run: |
          set +e
          node scripts/fetch.js
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "今天没有数据（非交易日或同花顺未更新），跳过抓取，继续构建"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "抓取失败，退出码 $code"
            exit "$code"
          fi

      - name: 构建页面
        run: python scripts/build.py

      - name: 提交并推送
        run: |
          git config user.name "fupan-bot"
          git config user.email "fupan-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 汇总
        run: |
          echo "### 更新完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "页面大小：$(stat -c%s index.html) 字节" >> $GITHUB_STEP_SUMMARY
          echo "数据文件数：$(ls data/raw | wc -l)" >> $GITHUB_STEP_SUMMARY
